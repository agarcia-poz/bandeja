# Evita que Supabase pause el proyecto gratuito en vacaciones:
# hace una consulta mínima cada 3 días.
# Requiere dos "secrets" en el repositorio: SUPABASE_URL y SUPABASE_ANON_KEY.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base de datos
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/tarifas?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
