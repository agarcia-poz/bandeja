# Evita que Supabase pause el proyecto gratuito en vacaciones:
# hace una consulta mínima a la base de datos cada 3 días.
# La URL y la clave publicable ya son públicas (están en index.html); la seguridad la ponen las políticas de la base de datos.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta mínima a la base de datos
        run: |
          curl -fsS "https://kbqlnomchinlshaxccpo.supabase.co/rest/v1/tarifas?select=id&limit=1" \
            -H "apikey: sb_publishable_NqXl9xDNJwFPYqW4ZZdZyQ_DzdYjIY8"
