}

function mkPago(a, concepto, fecha, metodo, tarifa) {
  const c = CONCEPTOS.find(x => x.id === concepto);
  return { id: 'P' + Math.random().toString(36).slice(2, 8), alumno: a.id, fecha, metodo, concepto, clases: c.clases, importe: precioDe(tarifa, concepto) };

function simSession(a, g, d, k, r) {
  const fcmax = fcMaxTeo(a);
  const dur = g.horas ? g.horas * 60 : (TARIFAS.find(t => t.id === g.tarifa).horas * 60);
  const lvl = { G1: 0, G2: .5, G3: 1 }[g.id];
  const intensity = .62 + lvl * .06 + (r() - .5) * .07 + Math.min(k, 6) * .004;
  const fcMed = Math.round(fcmax * intensity);
  const fcMax = Math.min(fcmax + 4, Math.round(fcmax * (intensity + .2 + r() * .08)));
  // distribución por zonas alrededor de la media
  const w = [.16, .3, .3, .17, .07].map((x, i) => x * (1 + (intensity - .66) * (i - 2) * 3) * (0.85 + r() * .3));
  const sum = w.reduce((s, x) => s + x, 0);
  const zonas = w.map(x => Math.max(0, Math.round(x / sum * dur * .92)));
  const kcal = Math.round(keytel(a, fcMed) * dur);
  return { id: `F${a.id}${d}`, alumno: a.id, fecha: d, duracion: dur, fcMed, fcMax, zonas, kcal, fuente: 'Polar H10' };
}

/* ---------- Fisiología ---------- */
const fcMaxTeo = a => 220 - a.edad;                       // misma fórmula que en tu hoja
const keytel = (a, hr) => a.sexo === 'F'                    // kcal/min (Keytel et al., 2005)
  ? Math.max(0, (-20.4022 + 0.4472 * hr - 0.1263 * a.peso + 0.074 * a.edad) / 4.184)
  : Math.max(0, (-55.0969 + 0.6309 * hr + 0.1988 * a.peso + 0.2017 * a.edad) / 4.184);
const zoneOf = (hr, max) => { const p = hr / max; return p >= .9 ? 5 : p >= .8 ? 4 : p >= .7 ? 3 : p >= .6 ? 2 : p >= .5 ? 1 : 0; };
const etrimp = z => z.reduce((s, m, i) => s + m * (i + 1), 0); // Edwards
function metrics(sess, a) {
  const m = fcMaxTeo(a);
  const med = sess.fcMed / m, mx = sess.fcMax / m;
  return { med, mx, rec: mx - med, trimp: etrimp(sess.zonas), kcal: sess.kcal };
}

function estadoChip(a) {

}
function ballRow(a, max = 12) {
  const c = compradas(a) + ajusteDe(a), u = asistidas(a);
  let h = '';
  const total = Math.max(c, u);
  for (let i = 0; i < Math.min(total, max); i++) {
    if (i < u && i < c) h += '<span class="ball used" title="Clase recibida"></span>';
    else if (i < c) h += '<span class="ball paid" title="Clase pagada pendiente"></span>';
    else h += '<span class="ball debt" title="Clase recibida sin pagar"></span>';

}

/* Variedad de redacción: misma idea, distintas palabras según el partido o el alumno (estable mientras se mira) */
function hashStr(t) { let h = 7; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
const varia = (semilla, ops) => ops[hashStr(semilla) % ops.length];

function lecturaPartido(m) {
  const S = statsDe(m); const st = S.st; const P = st.puntos; const out = [];
  if (P.length < 4) return [{ tono: 'neutral', t: 'Arrancando', d: 'Con unos puntos más aparecerán aquí las claves del partido: rachas, quién regala puntos, armas de cada jugador y cómo va el saque.' }];

  const ult = P.slice(-10), u0 = ult.filter(p => p.par === 0).length;
  const sv = k => m.id + k;

  else if (ult.length >= 8 && Math.abs(2 * u0 - ult.length) >= 4) { const dom = u0 * 2 > ult.length ? 0 : 1; out.push({ tono: 'warn', prio: 2, t: varia(sv('dom'), [`La pareja ${dom + 1} manda en este tramo`, `Inercia a favor de la pareja ${dom + 1}`, `La pareja ${dom + 1} lleva la iniciativa`]), d: `Se ha llevado ${dom ? ult.length - u0 : u0} de los últimos ${ult.length} puntos.` }); }
  else out.push({ tono: 'neutral', prio: 6, t: varia(sv('mom'), ['Momento del partido', 'Partido equilibrado', 'Sin dueño claro', 'Pulso igualado']), d: `Últimos ${ult.length} puntos: pareja 1 ${u0}, pareja 2 ${ult.length - u0}.` });

  out.push({ tono: 'neutral', prio: 7, t: varia(sv('dec'), ['Cómo se deciden los puntos', 'De dónde salen los puntos', 'Radiografía de los puntos', 'Qué cierra los puntos']), d: `${pct(nE / P.length)} por error no forzado, ${pct(nW / P.length)} con winner y ${pct((P.length - nE - nW) / P.length)} de otra forma (errores forzados, etc.).` });
  // Quién regala puntos
  [0, 1].forEach(k => {
    const pr = S.pair[k]; if (pr.lost < 3) return;
    const x = [S.jug[k * 2], S.jug[k * 2 + 1]].sort((a, b) => b.enf - a.enf)[0];
    if (x.enf < 2 || x.pctEnf < .3) return;
    const id = m.jugadores[x.j]?.id; const suyo = id ? Mh.alumno(id) : null; const gr = id && alumno(id) ? Mh.grupo(alumno(id).grupo) : null;
    const ref = suyo?.pctEnf != null ? ` Su media habitual es ${pct(suyo.pctEnf)}${gr?.pctEnf != null ? ` y la de su grupo ${pct(gr.pctEnf)}` : ''}.` : gr?.pctEnf != null ? ` La media de su grupo es ${pct(gr.pctEnf)}.` : '';
    out.push({ tono: 'bad', prio: 1, t: varia(sv('enf' + x.j), [`${nom(x.j)} concentra los errores`, `${nom(x.j)}, foco de errores`, `Los puntos regalados pasan por ${nom(x.j)}`, `${nom(x.j)} necesita más margen`]), d: `${x.enf} errores no forzados: el ${pct(x.pctEnf)} de los puntos que pierde su pareja${x.gEnf ? `, sobre todo de ${GOLPE_N[x.gEnf].toLowerCase()} (${x.ge[x.gEnf]})` : ''}.${ref}` });

    out.push({ tono: 'ok', prio: 3, t: varia(sv('win' + x.j), [`El arma de ${nom(x.j)}`, `${nom(x.j)} define los puntos`, `${nom(x.j)} pone la puntería`, `Dónde hace daño ${nom(x.j)}`]), d: `${x.win} winners (${pct(x.pctWin)} de los puntos de su pareja)${x.gWin ? `; ${x.gw[x.gWin]} de ${GOLPE_N[x.gWin].toLowerCase()}` : ''}.` });

function vParejas() {

  const L = Object.values(P).filter(x => x.tot >= 10).sort((x, y) => y.won / y.tot - x.won / x.tot).slice(0, 8);

function faltasSeguidas() {
  const out = [];
  reales().filter(a => !esRelevo(a) && grupo(a.grupo).id).forEach(a => {
    const listas = Object.entries(state.asistencia).filter(([k, o]) => k.startsWith(a.grupo + '|') && o && Object.keys(o).length).sort((x, y) => y[0].localeCompare(x[0]));
    let n = 0; for (const [, o] of listas) { const e = o[a.id]?.e; if (e === 'falta' || e === 'cubierta') n++; else break; }
    const tot = listas.length, vino = listas.filter(([, o]) => o[a.id]?.e === 'presente').length;

}

function interpretacion(a) {

  const gavg = k => gs.length ? gs.reduce((t, x) => t + x[k], 0) / gs.length : avg(k);

}

const charts = {};
function cv(name, alpha = 1) { const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return `rgb(${v} / ${alpha})`; }
function baseOpts({ y = {}, stacked = false } = {}) {
  const tick = { color: cv('--muted'), font: { family: 'Figtree', size: 12 } };

    maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { position: 'bottom', labels: { color: cv('--ink'), usePointStyle: true, boxWidth: 8, font: { family: 'Figtree', size: 12.5 } } }, tooltip: { backgroundColor: cv('--ink'), titleColor: cv('--bg'), bodyColor: cv('--bg'), padding: 10, cornerRadius: 10 } },
    scales: {
      x: { stacked, ticks: tick, grid: { display: false }, border: { color: cv('--line') } },
      y: { stacked, min: y.min, max: y.max, beginAtZero: y.beginAtZero, ticks: tick, grid: { color: cv('--line', .7) }, border: { display: false }, title: y.title ? { display: true, text: y.title, color: cv('--muted'), font: { family: 'Figtree', size: 12 } } : undefined }
    }
  };
}

async function need(q) { const { data, error } = await q; if (error) throw error; return data; }
async function fn(name, body) {
  const { data, error } = await sb.functions.invoke(name, { body });

async function loadAll(silencioso) {
  if (!silencioso) { ui.auth = 'cargando'; render(); }
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { ui.auth = 'login'; return render(); }
    ui.email = session.user.email;
    ui.isAdmin = (await need(sb.rpc('es_admin'))) === true;
    const q = t => sb.from(t).select('*');
    const vacio = Promise.resolve({ data: [], error: null });
    const [aj, tar, gr, al, pa, se, as, fc, te, em, av, ia, ajc, ga] = (await Promise.all([
      q('ajustes').maybeSingle(), q('tarifas').order('id'), q('grupos').eq('activo', true).order('dia_semana'), q('alumnos').order('nombre'), q('pagos'),
      q('sesiones'), q('asistencia'), q('registros_fc').order('fecha'), q('partidos').order('fecha'),
      ui.isAdmin ? q('emails').order('creado', { ascending: false }).limit(300) : vacio, ui.isAdmin ? q('avisos') : vacio, q('informes_ia').order('generado', { ascending: false }),
      q('ajustes_clases').order('fecha'), ui.isAdmin ? q('gastos').order('fecha') : vacio
    ])).map(r => { if (r.error) throw r.error; return r.data; });
    const s = emptyState();
    if (aj) { s.settings = { escuela: aj.escuela, remitente: aj.remitente, umbral: aj.umbral_aviso, temporada: aj.temporada, inicio: aj.inicio_temporada, auto: aj.envio_automatico }; SEASON_START = aj.inicio_temporada; }
    if (tar.length) TARIFAS = tar.map(t => ({ id: t.id, nombre: t.nombre, alumnos: t.alumnos_por_pista, horas: +t.horas, mes: +t.precio_mes, trimestre: +t.precio_trimestre }));
    s.grupos = gr.map(g => ({ id: g.id, nombre: g.nombre, dia: g.dia_semana, hora: g.hora_inicio.slice(0, 5), fin: g.hora_fin.slice(0, 5), tarifa: g.tarifa_id, nivel: g.nivel }));
    s.alumnos = al.filter(a => a.activo).map(a => ({ id: a.id, nombre: a.nombre, grupo: a.grupo_id, sexo: a.sexo, fnac: a.fecha_nacimiento, edad: edadDe(a.fecha_nacimiento), peso: +a.peso_kg || 70, inicial: a.clases_iniciales, email: a.email, tlf: a.telefono || '', codigo: a.codigo_acceso, activado: !!a.user_id, modalidad: a.modalidad || 'fijo', tutor: a.tutor_nombre, salud: a.consentimiento_salud, imagen: a.consentimiento_imagen }));
    s.pagos = pa.map(p => ({ id: p.id, alumno: p.alumno_id, fecha: p.fecha, metodo: p.metodo, concepto: p.concepto, clases: p.clases, importe: +p.importe }));
    const porId = {};
    se.forEach(x => { const k = `${x.grupo_id}|${x.fecha}`; porId[x.id] = k; s.sesionIds[k] = x.id; if (x.titulo || x.contenidos?.length) s.contenidos[k] = { titulo: x.titulo || 'Contenido por definir', items: x.contenidos || [] }; });
    as.forEach(x => { const k = porId[x.sesion_id]; if (k) (s.asistencia[k] = s.asistencia[k] || {})[x.alumno_id] = { e: x.estado || 'presente', c: x.cobra ?? true }; });
    s.ajustesClases = ajc.map(x => ({ id: x.id, alumno: x.alumno_id, fecha: x.fecha, clases: x.clases, motivo: x.motivo }));
    s.gastos = ga.map(x => ({ id: x.id, fecha: x.fecha, concepto: x.concepto, categoria: x.categoria, importe: +x.importe, metodo: x.metodo, notas: x.notas }));
    s.sesionesFC = fc.map(r => ({ id: r.id, alumno: r.alumno_id, fecha: r.fecha, duracion: r.duracion_min, fcMed: r.fc_media, fcMax: r.fc_max, zonas: r.zonas_min, kcal: r.kcal || 0, fuente: r.sensor }));
    s.partidos = te.map(x => ({ id: x.id, fecha: x.fecha, tipo: x.tipo, grupo: x.grupo_id, jugadores: x.jugadores, formato: x.formato, oro: x.punto_oro, saque: x.saque_inicial, sacadores: x.extra?.sacadores || null, sorteo: x.extra?.sorteo ?? null, ladoInv: !!x.extra?.ladoInv, eventos: x.eventos || [], estado: x.estado, resultado: x.resultado, creado: x.creado }));
    s.outbox = em.map(m => ({ id: m.id, alumno: m.alumno_id, to: m.destinatario, toName: m.nombre_destinatario, tipo: m.tipo, subject: m.asunto, body: m.cuerpo, html: m.html, fecha: m.creado, estado: ESTADO_EMAIL[m.estado], error: m.error }));
    av.forEach(x => { s.warned[`${x.alumno_id}|${x.clases_recibidas}`] = true; });
    ia.forEach(x => { if (!s.informes[x.alumno_id]) s.informes[x.alumno_id] = { id: x.id, texto: x.texto, publicado: x.publicado, generado: x.generado }; });
    state = s;
    if (!ui.isAdmin) {
      const me = state.alumnos[0];
      if (!me) { ui.auth = 'sin-ficha'; return render(); }
      const comp = await need(sb.rpc('comparativa'));
      (comp?.alumnos || []).forEach(x => state.alumnos.push({ id: x.k, anon: true, nombre: 'Compañero', grupo: x.grupo, edad: x.edad, sexo: x.sexo, peso: 70, inicial: 0, email: '' }));
      (comp?.sesiones || []).forEach(x => state.sesionesFC.push({ id: x.k + x.fecha, alumno: x.k, fecha: x.fecha, duracion: x.duracion, fcMed: x.fcMed, fcMax: x.fcMax, zonas: x.zonas, kcal: x.kcal || 0 }));
      const num = v => v == null ? null : +v;
      state.statsAnon = (comp?.partidos || []).map(x => ({ alumno: x.k, grupo: x.grupo, partido: x.p, fecha: x.fecha, enf: x.enf, win: x.win, dif: x.win - x.enf, pctEnf: num(x.pct_enf), pctWin: num(x.pct_win), pctOro: num(x.pct_oro), pctBreak: num(x.pct_break), ppj: num(x.ppj), indice: num(x.indice), ganado: x.ganado, gan: x.ganado == null ? null : x.ganado ? 1 : 0, pctPts: num(x.pct_puntos), pctSrv: num(x.pct_saque), pctSvPar: num(x.pct_saque_pareja), pctRsPar: num(x.pct_resto_pareja), pctHold: num(x.pct_juegos_saque), pctOroR: num(x.pct_oro_resto) }));
      ui.role = 'alumno'; ui.studentLogged = me.id; if (!['inicio', 'informe', 'partidos', 'pagos'].includes(ui.view) && !ui.view.startsWith('partido:')) ui.view = 'inicio';
    } else if (!silencioso) { ui.role = 'admin'; ui.view = 'panel'; }
    ui.auth = 'ok';
  } catch (err) {
    console.error(err); ui.auth = 'error'; ui.authError = err.message || String(err);
  }
  render();
}

const P = {
  async pago(p) { const d = await need(sb.from('pagos').insert({ alumno_id: p.alumno, fecha: p.fecha, metodo: p.metodo, concepto: p.concepto, clases: p.clases, importe: p.importe }).select('id').single()); p.id = d.id; },
  async email(m) { const d = await need(sb.from('emails').insert({ alumno_id: m.alumno, destinatario: m.to, nombre_destinatario: m.toName, tipo: m.tipo, asunto: m.subject, cuerpo: m.body, html: m.html || null }).select('id, creado').single()); m.id = d.id; m.fecha = d.creado; },
  async sesion(key, extra = {}) {
    const [grupo_id, fecha] = key.split('|');
    const d = await need(sb.from('sesiones').upsert({ grupo_id, fecha, ...extra }, { onConflict: 'grupo_id,fecha' }).select('id').single());
    state.sesionIds[key] = d.id; return d.id;
  },
  async asistencia(key, lista) {
    const id = await P.sesion(key);
    await need(sb.from('asistencia').delete().eq('sesion_id', id));
    const filas = Object.entries(lista).map(([a, v]) => ({ sesion_id: id, alumno_id: a, estado: v.e, cobra: v.c }));
    if (filas.length) await need(sb.from('asistencia').insert(filas));
  },
  async ajusteClases(x) { const d = await need(sb.from('ajustes_clases').insert({ alumno_id: x.alumno, fecha: x.fecha, clases: x.clases, motivo: x.motivo || null }).select('id').single()); x.id = d.id; },
  async gasto(g, nuevo) {
    const row = { fecha: g.fecha, concepto: g.concepto, categoria: g.categoria, importe: g.importe, metodo: g.metodo, notas: g.notas || null };
    const d = nuevo ? await need(sb.from('gastos').insert(row).select('id').single()) : await need(sb.from('gastos').update(row).eq('id', g.id).select('id').single());
    g.id = d.id;
  },
  async borrarGasto(id) { await need(sb.from('gastos').delete().eq('id', id)); },
  async aviso(alumnoId, n) { await need(sb.from('avisos').upsert({ alumno_id: alumnoId, clases_recibidas: n }, { onConflict: 'alumno_id,clases_recibidas' })); },
  async fc(r) { const d = await need(sb.from('registros_fc').insert({ alumno_id: r.alumno, fecha: r.fecha, duracion_min: r.duracion, fc_media: r.fcMed, fc_max: r.fcMax, zonas_min: r.zonas, kcal: r.kcal, sensor: r.fuente, muestras: r.muestras || null }).select('id').single()); r.id = d.id; },
  async alumno(a, nuevo) {
    const row = { modalidad: a.modalidad || 'fijo', nombre: a.nombre, email: a.email, telefono: a.tlf || null, grupo_id: a.grupo, fecha_nacimiento: a.fnac || null, sexo: a.sexo, peso_kg: a.peso || null, clases_iniciales: a.inicial || 0, tutor_nombre: a.tutor || null, consentimiento_salud: !!a.salud, consentimiento_imagen: !!a.imagen };
    const d = nuevo ? await need(sb.from('alumnos').insert(row).select('id, codigo_acceso').single()) : await need(sb.from('alumnos').update(row).eq('id', a.id).select('id, codigo_acceso').single());
    a.id = d.id; a.codigo = d.codigo_acceso;
  },
  async grupo(g, nuevo) {
    const row = { nombre: g.nombre, dia_semana: g.dia, hora_inicio: g.hora, hora_fin: g.fin, tarifa_id: g.tarifa, nivel: g.nivel || null };
    const d = nuevo ? await need(sb.from('grupos').insert(row).select('id').single()) : await need(sb.from('grupos').update(row).eq('id', g.id).select('id').single());
    g.id = d.id;

    try { await fn('activar-acceso', { codigo: $('#aC').value, email, password }); }
    catch (err) { ui.authMsg = err.message; ui.authOk = false; return render(); }
    await sb.auth.signInWithPassword({ email, password }); ui.authMsg = null; return loadAll();
  }
  if (f.id === 'fOlvido') {
    const { error } = await sb.auth.resetPasswordForEmail($('#oE').value.trim(), { redirectTo: APP_URL });
    ui.authMsg = error ? 'No se pudo enviar el enlace: ' + error.message : 'Si el email está registrado, te llegará un enlace en unos minutos.'; ui.authOk = !error; return render();
  }
  if (f.id === 'fNueva') {
    const { error } = await sb.auth.updateUser({ password: $('#aP2').value });
    if (error) return toast(error.message);
    toast('Contraseña actualizada'); history.replaceState(null, '', APP_URL); return loadAll();
  }
  if (f.id === 'fPago') {
    const a = alumno($('#pA').value); const c = CONCEPTOS.find(x => x.id === $('#pC').value);
    const p = { id: 'P' + Date.now(), alumno: a.id, fecha: $('#pF').value || TODAY_ISO, metodo: $('#pM').value, concepto: c.id, clases: c.clases, importe: +$('#pI').value || 0 };
    const sent = $('#pE').checked;
    state.pagos.push(p);
    const m = sent ? queueEmail(a, 'confirmacion', { concepto: c.nombre, importe: p.importe, fecha: p.fecha, metodo: p.metodo }) : null;
    closeModal();
    return tras(async () => { await P.pago(p); if (m) await P.email(m); }, sent ? `Pago registrado. Email de agradecimiento para ${a.nombre.split(' ')[0]}.` : 'Pago registrado');
  }
  if (f.id === 'fAsis') {
    const key = ui.claseKey; const lista = {};
    f.querySelectorAll('input[data-fijo]:checked').forEach(i => { const a = alumno(i.dataset.fijo); lista[a.id] = { e: i.value, c: cobraDe(i.value, a) }; });
    f.querySelectorAll('input[name=ex]:checked').forEach(i => { lista[i.value] = { e: 'presente', c: true }; });
    state.asistencia[key] = lista; if (ui.extraAsis) delete ui.extraAsis[key]; ui.asisDraft = null;
    const cobrados = Object.entries(lista).filter(([, v]) => v.c).map(([id]) => id);
    const nuevos = checkAvisos(cobrados);
    return tras(async () => { await P.asistencia(key, lista); for (const { a, n, m } of nuevos) { await P.aviso(a, n); await P.email(m); } },
      `Lista guardada: se cobra la clase a ${cobrados.length}${nuevos.length ? `. ${nuevos.length} ${nuevos.length === 1 ? 'aviso de pago' : 'avisos de pago'}` : ''}.`);
  }
  if (f.id === 'fAjuste') {
    const a = alumno(f.dataset.id); const n = parseInt($('#ajN').value, 10);
    if (!n) return toast('Indica cuántas clases sumar o restar');
    const x = { id: 'AJ' + Date.now(), alumno: a.id, fecha: TODAY_ISO, clases: n, motivo: $('#ajM').value.trim() };
    state.ajustesClases = state.ajustesClases || []; state.ajustesClases.push(x); closeModal();
    return tras(() => P.ajusteClases(x), `Saldo de ${a.nombre.split(' ')[0]}: ${saldo(a)} clases`);
  }
  if (f.id === 'fGasto') {
    const editId = f.dataset.id;
    const datos = { fecha: $('#gaF').value || TODAY_ISO, concepto: $('#gaC').value.trim(), categoria: $('#gaK').value, importe: Math.round((+$('#gaI').value || 0) * 100) / 100, metodo: $('#gaM').value, notas: $('#gaN').value.trim() };
    closeModal();
    if (editId) { const g = state.gastos.find(x => x.id === editId); Object.assign(g, datos); return tras(() => P.gasto(g, false), 'Gasto guardado'); }
    const g = { id: 'GA' + Date.now(), ...datos }; state.gastos.push(g);
    return tras(() => P.gasto(g, true), 'Gasto registrado');
  }
  if (f.id === 'fCont') {
    const c = { titulo: $('#cTit').value.trim() || 'Sin título', items: $('#cItems').value.split('\n').map(s => s.trim()).filter(Boolean) };
    state.contenidos[ui.claseKey] = c; const key = ui.claseKey;
    return tras(() => P.sesion(key, { titulo: c.titulo, contenidos: c.items }), 'Contenidos guardados');
  }
  if (f.id === 'fAlta') {
    const editId = f.dataset.id;
    const datos = { nombre: $('#nN').value.trim(), email: $('#nE').value.trim(), tlf: $('#nT').value.trim(), grupo: $('#nG').value, fnac: $('#nF').value, sexo: $('#nS').value, peso: +$('#nP').value || 70, inicial: +$('#nI').value || 0, tutor: $('#nTu').value.trim(), salud: $('#nSal').checked, imagen: $('#nIm').checked, modalidad: $('#nMo').value };
    datos.edad = edadDe(datos.fnac);
    const bien = $('#nBien') ? $('#nBien').checked : true;
    closeModal();
    if (editId) { const a = alumno(editId); Object.assign(a, datos); return tras(() => P.alumno(a, false), 'Ficha actualizada'); }
    const a = { id: 'A' + Date.now(), codigo: `PD-${Math.random().toString(36).slice(2, 7).toUpperCase()}`, ...datos };
    ui.bienvenidaAlta = bien;
    state.alumnos.push(a);
    const msg = `Alta hecha. Código de acceso: ${a.codigo}${bien ? '' : ' (sin email de bienvenida)'}`;
    if (!LIVE) { if (bien) queueEmail(a, 'bienvenida'); save(); toast(msg); return go('alumno:' + a.id); }
    try { await P.alumno(a, true); if (bien) { const m = queueEmail(a, 'bienvenida'); await P.email(m); } toast(msg); go('alumno:' + a.id); if (bien && state.settings.auto) await P.enviar(false); }
    catch (err) { fallo(err); }
    return;
  }
  if (f.id === 'fGrupo') {
    const editId = f.dataset.id;
    const datos = { nombre: $('#gN').value.trim(), dia: +$('#gD').value, hora: $('#gH').value, fin: $('#gF').value, tarifa: $('#gT').value, nivel: $('#gNv').value.trim() };
    closeModal();
    if (editId) { const g = grupo(editId); Object.assign(g, datos); return tras(() => P.grupo(g, false), 'Grupo guardado'); }
    const g = { id: 'G' + Date.now(), ...datos }; state.grupos.push(g); ui.filtroGrupo = 'todos';
    return tras(() => P.grupo(g, true), 'Grupo creado');
  }
  if (f.id === 'fPartido') {
    const jugadores = [0, 1, 2, 3].map(j => { const v = $('#mJ' + j).value; if (v === 'inv') return { id: null, nombre: $('#mN' + j).value.trim() || `Invitado ${j + 1}` }; const a = v ? alumno(v) : null; return a ? { id: a.id, nombre: a.nombre } : { id: null, nombre: `Jugador ${j + 1}` }; });
    const ids = jugadores.map(j => j.id).filter(Boolean);
    if (new Set(ids).size !== ids.length) return toast('Hay un jugador repetido');
    const g = ids.length ? alumno(ids[0]).grupo : null;
    const m = { id: (crypto.randomUUID ? crypto.randomUUID() : 'M' + Date.now()), fecha: $('#mF').value || TODAY_ISO, tipo: $('#mT').value, grupo: g, jugadores, formato: $('#mFo').value, oro: $('#mO').checked, saque: 0, sacadores: {}, sorteo: null, ladoInv: false, eventos: [], estado: 'en_juego', resultado: '0-0', creado: new Date().toISOString() };
    state.partidos = state.partidos || []; state.partidos.push(m);
    closeModal(); guardarPartido(m, true); return go('partido:' + m.id);
  }
  if (f.id === 'fAjustes') {
    state.settings.escuela = $('#sEsc').value.trim() || state.settings.escuela; state.settings.remitente = $('#sRem').value.trim(); state.settings.umbral = +$('#sUmb').value;
    return tras(() => P.ajustes(state.settings), 'Reglas guardadas');
  }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.addEventListener('resize', () => { if (ui.view === 'vivo') drawLive(); });
if (!LIVE && !state.pseed) { state.partidos = seedPartidos(state); state.pseed = true; save(); }
if (LIVE) {
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { ui.auth = 'nueva-clave'; render(); } });
  if (/type=recovery/.test(location.hash)) { ui.auth = 'nueva-clave'; render(); } else loadAll();
} else render();
</script>


</html>
