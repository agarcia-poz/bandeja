<script>
/* ==========================================================
   Bandeja · prototipo con datos de ejemplo
   ========================================================== */
const S = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const KEY = 'bandeja-demo-v1';
const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (s, opt = { weekday: 'short', day: 'numeric', month: 'short' }) => parseISO(s).toLocaleDateString('es-ES', opt);
const fmtEur = n => n.toLocaleString('es-ES', { style: 'currency', currency: 'EUR', minimumFractionDigits: n % 1 ? 2 : 0 });
const pct = (n, d = 0) => (n * 100).toFixed(d).replace('.', ',') + ' %';
const dec = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const TODAY_ISO = iso(TODAY);
const DAYS = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Tarifas (de la hoja TARIFAS) ---------- */
let TARIFAS = [
  { id: 'T1', nombre: 'Grupo 4 · 1,5 h', alumnos: 4, horas: 1.5, mes: 40, trimestre: 95 },
  { id: 'T2', nombre: 'Pareja · 1 h', alumnos: 2, horas: 1, mes: 60, trimestre: 140 },
  { id: 'T3', nombre: 'Grupo 4 · 1 h', alumnos: 4, horas: 1, mes: 30, trimestre: 65 }
];
const CONCEPTOS = [
  { id: 'mes', nombre: 'Bono mensual (4 clases)', clases: 4 },
  { id: 'tri', nombre: 'Bono trimestral (10 clases)', clases: 10 },
  { id: 'suelta', nombre: 'Clase suelta', clases: 1 },
  { id: 'material', nombre: 'Material (sin clases)', clases: 0 }
];
const precioDe = (tarifa, concepto) => {
  const t = TARIFAS.find(x => x.id === tarifa) || TARIFAS[0];
  if (concepto === 'mes') return t.mes;
  if (concepto === 'tri') return t.trimestre;
  if (concepto === 'suelta') return Math.round(t.mes / 4 + 3);
  return 0;
};

/* ---------- Contenidos de sesión ---------- */
const PLAN = [
  { t: 'Posición base y desplazamientos', i: ['Split-step y posición de espera', 'Desplazamiento lateral en paso cruzado', 'Juego condicionado: solo fondo'] },
  { t: 'Salida de pared de derecha', i: ['Lectura del bote y la pared', 'Golpeo por delante del cuerpo', 'Serie de 3 × 10 salidas con dirección'] },
  { t: 'Volea de derecha y de revés', i: ['Empuñadura continental', 'Volea bloqueada a los pies', 'Juego 2 contra 2 en red'] },
  { t: 'La bandeja', i: ['Preparación lateral y punto de impacto', 'Dirección cruzada a la reja', 'Transición red–fondo tras bandeja'] },
  { t: 'Globo defensivo y recuperación de la red', i: ['Globo alto desde el fondo', 'Subida coordinada en pareja', 'Puntos a 3 bolas'] },
  { t: 'Salida de pared de revés', i: ['Giro de hombros y espera', 'Golpe paralelo y cruzado', 'Partido con puntos de oro'] },
  { t: 'Remate plano y por 3', i: ['Remate plano a la T', 'Remate por 3 con efecto', 'Defensa del remate en pareja'] },
  { t: 'Estrategia en el punto de oro', i: ['Elección del restador', 'Patrones de saque y primera volea', 'Partido a juegos cortos'] }
];

/* ---------- Grupos y alumnado de ejemplo (ficticio) ---------- */
let SEASON_START = '2026-09-14';
const GRUPOS = [
  { id: 'G1', nombre: 'Iniciación adultos', dia: 1, hora: '19:00', fin: '20:30', tarifa: 'T1', nivel: 'Iniciación' },
  { id: 'G2', nombre: 'Perfeccionamiento', dia: 3, hora: '20:00', fin: '21:00', tarifa: 'T3', nivel: 'Intermedio' },
  { id: 'G3', nombre: 'Pareja competición', dia: 4, hora: '18:00', fin: '19:00', tarifa: 'T2', nivel: 'Avanzado' }
];
const ALUMNOS_BASE = [
  ['Lucía Navarro Ortega', 'G1', 'F', 34, 62, 'mes', 1],
  ['Javier Moreno Ruiz', 'G1', 'M', 41, 84, 'mes', 0],
  ['Carmen Delgado Vílchez', 'G1', 'F', 29, 58, 'tri', 0],
  ['Rubén Torres Gámez', 'G1', 'M', 47, 90, 'mes', 0],
  ['Elena Castro Medina', 'G2', 'F', 38, 64, 'mes2', 0],
  ['Pablo Jiménez Rus', 'G2', 'M', 23, 74, 'mes', 0],
  ['Sergio Almagro Cobo', 'G2', 'M', 31, 79, 'tri', 2],
  ['Nuria Fuentes Lara', 'G2', 'F', 44, 66, 'mes', 0],
  ['Marcos Serrano Peña', 'G3', 'M', 27, 77, 'mes2', 0],
  ['Irene Valero Soto', 'G3', 'F', 25, 59, 'mes', 0]
];

function sessionDates(g, fromISO, toISO) {
  const out = []; const d = parseISO(fromISO); const end = parseISO(toISO);
  while (d.getDay() !== g.dia) d.setDate(d.getDate() + 1);
  while (d <= end) { out.push(iso(d)); d.setDate(d.getDate() + 7); }
  return out;
}

function seed() {
  const r = rng(20261016);
  const st = {
    settings: { escuela: 'Escuela de Pádel AG', umbral: 1, remitente: 'escuelapadelag@gmail.com', temporada: '26/27', inicio: SEASON_START, auto: true },
    grupos: GRUPOS, alumnos: [], pagos: [], asistencia: {}, contenidos: {}, sesionesFC: [], tests: [], outbox: [], warned: {}, informes: {}, sesionIds: {}
  };
  ALUMNOS_BASE.forEach(([nombre, g, sexo, edad, peso, plan, inicial], i) => {
    const first = nombre.split(' ')[0].toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    st.alumnos.push({
      id: 'A' + (i + 1), nombre, grupo: g, sexo, edad, peso, inicial,
      email: `${first}.${['n', 'm', 'd', 't', 'c', 'j', 'a', 'f', 's', 'v'][i]}@ejemplo.es`,
      tlf: '6' + String(10000000 + Math.floor(r() * 89999999)).slice(0, 8),
      codigo: `PD-${String(1000 + Math.floor(r() * 8999))}`,
      alta: SEASON_START, plan, fnac: `${2026 - edad}-05-15`, salud: true, imagen: true, activado: i < 4
    });
  });
  // pagos
  st.alumnos.forEach(a => {
    const g = GRUPOS.find(x => x.id === a.grupo);
    const first = sessionDates(g, '2026-09-07', SEASON_START)[0] || SEASON_START;
    const method = r() < .55 ? 'Bizum' : (r() < .6 ? 'Efectivo' : 'Transferencia');
    if (a.plan === 'tri') st.pagos.push(mkPago(a, 'tri', '2026-09-12', method, g.tarifa));
    else {
      st.pagos.push(mkPago(a, 'mes', '2026-09-12', method, g.tarifa));
      if (a.plan === 'mes2') st.pagos.push(mkPago(a, 'mes', '2026-10-09', method, g.tarifa));
    }
  });
  // asistencia + contenidos + sesiones FC
  GRUPOS.forEach((g, gi) => {
    const past = sessionDates(g, SEASON_START, iso(new Date(TODAY.getTime() - 86400000)));
    const future = sessionDates(g, TODAY_ISO, iso(new Date(TODAY.getTime() + 40 * 86400000)));
    [...past, ...future].forEach((d, k) => {
      const p = PLAN[(k + gi) % PLAN.length];
      st.contenidos[`${g.id}|${d}`] = { titulo: p.t, items: p.i.slice() };
    });
    const miembros = st.alumnos.filter(a => a.grupo === g.id);
    past.forEach((d, k) => {
      const presentes = miembros.filter(a => !(r() < .12 && k > 0)).map(a => a.id);
      st.asistencia[`${g.id}|${d}`] = presentes;
      presentes.forEach(id => {
        const a = st.alumnos.find(x => x.id === id);
        st.sesionesFC.push(simSession(a, g, d, k, r));
      });
    });
  });
  // tests de condición física (octubre)
  st.alumnos.forEach(a => {
    const lvl = { G1: 0, G2: .5, G3: 1 }[a.grupo];
    const ageF = (a.edad - 30) / 40;
    st.tests.push({
      id: 'T' + a.id, alumno: a.id, periodo: 'Octubre', fecha: '2026-10-05',
      peso: a.peso, ag1: +(12.4 - lvl * 1.6 + ageF * 1.4 + r() * .9).toFixed(2), ag2: +(9.8 - lvl * 1.2 + ageF * 1.1 + r() * .7).toFixed(2),
      ag3: +(15.6 - lvl * 2 + ageF * 1.8 + r() * 1.1).toFixed(2), precision: Math.round(8 + lvl * 7 + r() * 4 - ageF * 2), rpe: Math.round(5 + r() * 3)
    });
  });
  // temporada pasada para dos alumnos que vuelven
  [['A3', [13.6, 13.1, 12.7, 12.3], [10.8, 10.4, 10.1, 9.9], [16.9, 16.5, 16.0, 15.6], [9, 10, 12, 13]],
   ['A7', [12.0, 11.7, 11.5, 11.3], [9.5, 9.3, 9.1, 9.0], [15.0, 14.6, 14.3, 14.1], [12, 13, 13, 15]]].forEach(([id, a1, a2, a3, pr]) => {
    ['Oct 24', 'Dic 24', 'Abr 25', 'Jun 25'].forEach((p, i) => st.tests.push({ id: `H${id}${i}`, alumno: id, periodo: p, fecha: ['2024-10-07', '2024-12-09', '2025-04-07', '2025-06-09'][i], peso: null, ag1: a1[i], ag2: a2[i], ag3: a3[i], precision: pr[i], rpe: null, historico: true }));
  });
  return st;
}
function mkPago(a, concepto, fecha, metodo, tarifa) {
  const c = CONCEPTOS.find(x => x.id === concepto);
  return { id: 'P' + Math.random().toString(36).slice(2, 8), alumno: a.id, fecha, metodo, concepto, clases: c.clases, importe: precioDe(tarifa, concepto) };
}
function simSession(a, g, d, k, r) {
  const fcmax = fcMaxTeo(a);
  const dur = g.horas ? g.horas * 60 : (TARIFAS.find(t => t.id === g.tarifa).horas * 60);
  const lvl = { G1: 0, G2: .5, G3: 1 }[g.id];
  const intensity = .62 + lvl * .06 + (r() - .5) * .07 + Math.min(k, 6) * .004;
  const fcMed = Math.round(fcmax * intensity);
  const fcMax = Math.min(fcmax + 4, Math.round(fcmax * (intensity + .2 + r() * .08)));
  // distribución por zonas alrededor de la media
  const w = [.16, .3, .3, .17, .07].map((x, i) => x * (1 + (intensity - .66) * (i - 2) * 3) * (0.85 + r() * .3));
  const sum = w.reduce((s, x) => s + x, 0);
  const zonas = w.map(x => Math.max(0, Math.round(x / sum * dur * .92)));
  const kcal = Math.round(keytel(a, fcMed) * dur);

    <div class="mt-4">${zoneBar(last.zonas)}<div class="flex flex-wrap gap-x-4 gap-y-1 mt-2 text-[12.5px] text-muted">${last.zonas.map((m, i) => `<span><span class="tz${i + 1}">●</span> Z${i + 1} ${m} min</span>`).join('')}</div></div>
  </section>` : ''}`;
}
function interpretacion(a) {
  const ss = sesionesDe(a.id); if (ss.length < 2) return ['Con un par de sesiones más podremos interpretar tus datos.'];
  const m = ss.map(s => metrics(s, a));
  const avg = k => m.reduce((t, x) => t + x[k], 0) / m.length;
  const gIds = state.alumnos.filter(x => x.grupo === a.grupo && x.id !== a.id).map(x => x.id);
  const gs = state.sesionesFC.filter(s => gIds.includes(s.alumno)).map(s => metrics(s, alumno(s.alumno)));
  const gavg = k => gs.length ? gs.reduce((t, x) => t + x[k], 0) / gs.length : avg(k);
  const first = m.slice(0, Math.ceil(m.length / 2)), second = m.slice(Math.ceil(m.length / 2));
  const trend = (second.reduce((t, x) => t + x.med, 0) / second.length) - (first.reduce((t, x) => t + x.med, 0) / first.length);
  const z45 = ss.reduce((t, s) => t + s.zonas[3] + s.zonas[4], 0) / ss.reduce((t, s) => t + s.zonas.reduce((u, x) => u + x, 0), 0);
  const out = [];
  out.push(`En tus ${ss.length} sesiones trabajas de media al ${pct(avg('med'))} de tu frecuencia máxima teórica (${fcMaxTeo(a)} ppm). ${avg('med') > gavg('med') + .02 ? 'Es algo más que la media de tu grupo: estás poniendo mucha intensidad.' : avg('med') < gavg('med') - .02 ? 'Es algo menos que la media de tu grupo, así que tienes margen para apretar en los ejercicios de juego.' : 'Estás en línea con la media de tu grupo.'}`);
  out.push(`Pasas el ${pct(z45)} del tiempo en zonas 4 y 5, las de mayor esfuerzo. ${z45 > .3 ? 'Es un porcentaje alto; cuida el descanso entre clases e hidrátate bien.' : z45 < .12 ? 'Es un porcentaje bajo: los puntos largos y los ejercicios de red son buenos momentos para subir el ritmo.' : 'Es un reparto equilibrado para una clase técnica.'}`);
  out.push(`Tu índice de recuperación (diferencia entre la FC máxima y la media) es del ${pct(avg('rec'))}${avg('rec') > gavg('rec') ? ', por encima de tu grupo: tu corazón baja bien entre esfuerzos.' : ', algo por debajo de tu grupo; mejorará con trabajo aeróbico suave fuera de pista.'}`);
  if (Math.abs(trend) > .015) out.push(trend > 0 ? 'En las últimas clases tu FC media ha subido. Puede deberse a contenidos más exigentes o a cansancio acumulado; lo comentamos en pista.' : 'En las últimas clases tu FC media ha bajado con contenidos parecidos, una buena señal de adaptación.');
  return out;
}

    const key = ui.claseKey;
    state.asistencia[key] = ids; const nuevos = checkAvisos(ids);
    return tras(async () => { await P.asistencia(key, ids); for (const { a, n, m } of nuevos) { await P.aviso(a, n); await P.email(m); } },
      nuevos.length ? `Asistencia guardada. ${nuevos.length} ${nuevos.length === 1 ? 'aviso de pago' : 'avisos de pago'}.` : 'Asistencia guardada');
  }
  if (f.id === 'fCont') {
    const c = { titulo: $('#cTit').value.trim() || 'Sin título', items: $('#cItems').value.split('\n').map(s => s.trim()).filter(Boolean) };
    state.contenidos[ui.claseKey] = c; const key = ui.claseKey;
    return tras(() => P.sesion(key, { titulo: c.titulo, contenidos: c.items }), 'Contenidos guardados');
  }
  if (f.id === 'fTest') {
    const id = $('#tA').value; let t = state.tests.find(x => x.alumno === id && x.periodo === ui.periodo);
    if (!t) { t = { id: 'T' + Date.now(), alumno: id, periodo: ui.periodo, fecha: TODAY_ISO }; state.tests.push(t); }
    TEST_FIELDS.forEach(([k]) => { const v = $('#t_' + k).value; t[k] = v === '' ? null : +v; });
    closeModal(); return tras(() => P.test(t), 'Test guardado');
  }
  if (f.id === 'fAlta') {
    const editId = f.dataset.id;
    const datos = { nombre: $('#nN').value.trim(), email: $('#nE').value.trim(), tlf: $('#nT').value.trim(), grupo: $('#nG').value, fnac: $('#nF').value, sexo: $('#nS').value, peso: +$('#nP').value || 70, inicial: +$('#nI').value || 0, tutor: $('#nTu').value.trim(), salud: $('#nSal').checked, imagen: $('#nIm').checked };
    datos.edad = edadDe(datos.fnac);
    closeModal();
    if (editId) { const a = alumno(editId); Object.assign(a, datos); return tras(() => P.alumno(a, false), 'Ficha actualizada'); }
    const a = { id: 'A' + Date.now(), codigo: `PD-${Math.random().toString(36).slice(2, 7).toUpperCase()}`, ...datos };
    state.alumnos.push(a);
    if (!LIVE) { queueEmail(a, 'bienvenida'); save(); toast(`Alta hecha. Código de acceso: ${a.codigo}`); return go('alumno:' + a.id); }
    try { await P.alumno(a, true); const m = queueEmail(a, 'bienvenida'); await P.email(m); toast(`Alta hecha. Código de acceso: ${a.codigo}`); go('alumno:' + a.id); if (state.settings.auto) await P.enviar(false); }
    catch (err) { fallo(err); }
    return;
  }
  if (f.id === 'fGrupo') {
    const editId = f.dataset.id;
    const datos = { nombre: $('#gN').value.trim(), dia: +$('#gD').value, hora: $('#gH').value, fin: $('#gF').value, tarifa: $('#gT').value, nivel: $('#gNv').value.trim() };
    closeModal();
    if (editId) { const g = grupo(editId); Object.assign(g, datos); return tras(() => P.grupo(g, false), 'Grupo guardado'); }
    const g = { id: 'G' + Date.now(), ...datos }; state.grupos.push(g); ui.filtroGrupo = 'todos';
    return tras(() => P.grupo(g, true), 'Grupo creado');
  }
  if (f.id === 'fAjustes') {
    state.settings.escuela = $('#sEsc').value.trim() || state.settings.escuela; state.settings.remitente = $('#sRem').value.trim(); state.settings.umbral = +$('#sUmb').value;
    return tras(() => P.ajustes(state.settings), 'Reglas guardadas');
  }
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
window.addEventListener('resize', () => { if (ui.view === 'vivo') drawLive(); });
if (LIVE) {
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { ui.auth = 'nueva-clave'; render(); } });
  if (/type=recovery/.test(location.hash)) { ui.auth = 'nueva-clave'; render(); } else loadAll();
} else render();
</script>
